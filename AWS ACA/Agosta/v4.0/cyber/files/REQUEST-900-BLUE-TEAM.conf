# Sonda innocua di integrazione. Un ID diverso per ogni esecuzione.
# deny permette di rilevare un'eventuale attivazione accidentale del blocco.
SecRule ARGS:bt_probe "@rx ^bt-[a-f0-9]{32}$" "id:10001,phase:2,t:none,deny,status:403,log,auditlog,ctl:auditEngine=On,msg:'Blue Team telemetry probe'"

# Difese sul proxy pubblico. Le condizioni disruptive sono osservate in DetectionOnly.
# FTP espone solo l'informativa legale. Tenere inventariati i documenti pubblici.
SecRule REQUEST_FILENAME "@rx (?i)^/ftp(?:/|$)" "id:10011,phase:1,t:none,t:urlDecodeUni,t:normalizePath,deny,status:403,log,auditlog,msg:'Blue Team private download',chain"
    SecRule REQUEST_FILENAME "!@streq /ftp/legal.md" "t:none,t:urlDecodeUni,t:normalizePath"

SecRule REQUEST_FILENAME "@rx (?i)^/support/logs(?:/|$)" "id:10012,phase:1,t:none,t:urlDecodeUni,t:normalizePath,deny,status:403,log,auditlog,msg:'Blue Team private access logs'"

SecRule REQUEST_FILENAME "@rx (?i)^/metrics/?$" "id:10013,phase:1,t:none,t:urlDecodeUni,t:normalizePath,deny,status:403,log,auditlog,msg:'Blue Team public metrics'"

# Sul proxy di registrazione il ruolo viene assegnato dal server.
SecRule REQUEST_FILENAME "@rx (?i)^/api/users/?$" "id:10014,phase:2,t:none,t:normalizePath,deny,status:403,log,auditlog,msg:'Blue Team privileged registration',chain"
    SecRule REQUEST_METHOD "@streq POST" "t:none,chain"
        SecRule ARGS:json.role|ARGS:role "@rx (?i)^admin$" "t:none"

SecRule REQUEST_FILENAME "@rx (?i)^/api/basketitems(?:/[0-9]+)?/?$" "id:10015,phase:2,t:none,t:normalizePath,deny,status:403,log,auditlog,msg:'Blue Team negative basket quantity',chain"
    SecRule REQUEST_METHOD "@rx ^(?:PUT|POST|PATCH)$" "t:none,chain"
        SecRule ARGS:json.quantity|ARGS:quantity "@rx ^-[0-9]+$" "t:none"
