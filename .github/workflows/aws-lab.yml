name: AWS lab

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Validate Terraform
        shell: bash
        run: |
          set -euo pipefail
          for dir in "AWS ACA/Agosta/v3.1/backend" "AWS ACA/Agosta/v3.1/project"; do
            export TF_DATA_DIR="$RUNNER_TEMP/terraform-$(basename "$dir")"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Scan the repository with Checkov
        shell: bash
        run: |
          set -euo pipefail
          pip install checkov==3.4.6
          export CKV_IGNORE_HIDDEN_DIRECTORIES=false
          checkov -d . --skip-download -o json > "$RUNNER_TEMP/checkov.json" || test "$?" -eq 1
          checkov -d . --framework secrets --enable-secret-scan-all-files --skip-download -o json > "$RUNNER_TEMP/checkov-secrets.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "checkov.json").read_text())
          results = data if isinstance(data, list) else [data]
          if not any(r.get("check_type") == "terraform" for r in results):
              raise SystemExit("Checkov did not produce a Terraform report")
          for report in results:
              summary = report.get("summary", report)
              print(report.get("check_type", "secrets"), {
                  key: summary[key] for key in ("passed", "failed", "skipped", "parsing_errors")
              })
              if summary["parsing_errors"]:
                  raise SystemExit(1)
          PY

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: aws-lab
    concurrency:
      group: aws-lab
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_BACKEND_BUCKET: ${{ vars.TF_BACKEND_BUCKET }}
    defaults:
      run:
        working-directory: 'AWS ACA/Agosta/v3.1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Require independent deployment approval
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            -H 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/aws-lab" |
            jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and .prevent_self_review == true and (.reviewers | length > 0))' > /dev/null
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Apply approved infrastructure
        shell: bash
        env:
          TF_VAR_region: ${{ vars.AWS_REGION }}
          TF_VAR_configure_with_ansible: ${{ vars.CONFIGURE_WITH_ANSIBLE }}
        run: |
          set -euo pipefail
          : "${AWS_REGION:?}" "${TF_BACKEND_BUCKET:?}" "${TF_VAR_configure_with_ansible:?}"
          terraform -chdir=project init -input=false \
            -backend-config="bucket=$TF_BACKEND_BUCKET" -backend-config="region=$AWS_REGION"
          terraform -chdir=project plan -input=false -lock-timeout=5m \
            -out="$RUNNER_TEMP/lab.tfplan" > "$RUNNER_TEMP/plan.log"
          terraform -chdir=project show -json "$RUNNER_TEMP/lab.tfplan" |
            jq -e 'all(.resource_changes[]?; .change.actions | index("delete") | not)' > /dev/null
          terraform -chdir=project apply -input=false -lock-timeout=5m "$RUNNER_TEMP/lab.tfplan" > "$RUNNER_TEMP/apply.log"
          echo 'Infrastructure apply succeeded'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: vars.CONFIGURE_WITH_ANSIBLE == 'true'
        with:
          python-version: '3.12'
      - name: Run the approved Ansible deployment
        if: vars.CONFIGURE_WITH_ANSIBLE == 'true'
        shell: bash
        env:
          WAZUH_VERSION: ${{ vars.WAZUH_VERSION }}
          WAZUH_INSTALLER_SHA256: ${{ vars.WAZUH_INSTALLER_SHA256 }}
        run: |
          set -euo pipefail
          : "${WAZUH_VERSION:?}" "${WAZUH_INSTALLER_SHA256:?}"
          umask 077
          python -m pip install -r requirements.txt
          python lab.py outputs
          ids=$(jq -r '.instances.value[].id' evidence/outputs.json | sort)
          for attempt in {1..40}; do
            online=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$(paste -sd, <<< "$ids")" \
              --query 'InstanceInformationList[?PingStatus == `Online`].InstanceId' --output json | jq -r '.[]' | sort)
            if [[ "$online" == "$ids" ]]; then break; fi
            sleep 15
          done
          [[ "$online" == "$ids" ]]
          python configure.py --wazuh-version "$WAZUH_VERSION" --wazuh-installer-sha256 "$WAZUH_INSTALLER_SHA256" > "$RUNNER_TEMP/ansible.log" 2>&1
          python apply_cyber.py > "$RUNNER_TEMP/cyber-config.log" 2>&1
          python configure.py --verify-only > "$RUNNER_TEMP/verify.log" 2>&1
          echo 'Ansible configuration and checks succeeded'
